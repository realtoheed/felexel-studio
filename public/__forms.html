<!doctype html>
<!--
  This file exists purely so Netlify's form-detection bot has plain static
  HTML to scan. Next.js's App Router doesn't produce scannable static HTML
  at build time, so @netlify/plugin-nextjs refuses to build if data-netlify
  attributes appear in the app's own output — the real forms in
  src/components/Contact.tsx and AffiliatedArtist.tsx submit here via fetch
  (see src/lib/useNetlifyForm.ts) but carry no Netlify attributes themselves.
  This page is never visited by a person.
  Docs: https://opennext.js.org/netlify/forms
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Form definitions (not a real page)</title>
  </head>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="company" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="company" />
    </form>
    <form name="affiliated-artist" data-netlify="true" netlify-honeypot="company" hidden>
      <input type="hidden" name="form-name" value="affiliated-artist" />
      <input type="text" name="artistName" />
      <input type="email" name="email" />
      <textarea name="details"></textarea>
      <input type="text" name="company" />
    </form>
    <form name="pay-now" data-netlify="true" netlify-honeypot="company" hidden>
      <input type="hidden" name="form-name" value="pay-now" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="package" />
      <input type="text" name="amount" />
      <textarea name="notes"></textarea>
      <input type="text" name="company" />
    </form>
  </body>
</html>
